<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maz'Wave</title>
    <link rel="icon" type="image/png" href="../assets/images/m2.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =================== */
      /* 🌐 RESET ET BASE    */
      /* =================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        height: 100%;
        font-family: "Poppins", sans-serif;
        color: #fff;
      }

      body {
        filter: blur(10px);
        transition: filter 1s ease;
        background-color: transparent;
      }

      html {
        background-color: black;
      }

      body.loaded {
        filter: blur(0);
      }

      /* =================== */
      /* 🧭 NAVBAR FIXE      */
      /* =================== */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(5px);
        z-index: 1000;
      }

      .navbar .logo {
        font-size: 1.5em;
        font-weight: 600;
        color: white;
      }

      .navbar .nav-links {
        list-style: none;
        display: flex;
        gap: 25px;
      }

      .navbar .nav-links li a {
        color: white;
        text-decoration: none;
        font-weight: 300;
        transition: color 0.3s;
      }

      .navbar .nav-links li a:hover {
        color: #ffce73;
      }

      /* =================== */
      /* ⏳ CONTENU CENTRÉ   */
      /* =================== */
      main {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 2rem;
        color: #dddddd;
        text-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      }

      .loader {
        border: 8px solid #e0e0e0;
        border-top: 8px solid #3498db;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* =================== */
      /* ✨ TRANSITIONS      */
      /* =================== */
      .page-transition {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(0);
        background-color: rgba(0, 0, 0, 0);
        z-index: 2000;
        pointer-events: none;
        transition: backdrop-filter 0.6s ease, background-color 0.6s ease;
      }

      .page-transition.active {
        backdrop-filter: blur(8px);
        background-color: rgba(0, 0, 0, 0.3);
      }

      body.blur-out {
        filter: blur(10px);
        transition: filter 0.5s ease;
      }

      /* Compense la hauteur de la navbar pour éviter qu’elle cache le contenu */
      main {
        padding-top: 60px;
      }
    </style>
  </head>

  <body>
    <!-- =================== -->
    <!-- 🧭 NAVIGATION       -->
    <!-- =================== -->
    <header>
      <nav class="navbar">
        <div class="logo">Mon Portfolio</div>
        <ul class="nav-links">
          <li><a href="../index-accueil/index.html">Accueil</a></li>
          <li><a href="../apropos/apropos.html">À propos</a></li>
          <li>
            <a
              href="../projet/projet.html"
              style="border-bottom: 2px solid #ffce73"
              >Projets</a
            >
          </li>
          <li><a href="../contact/contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- =================== -->
    <!-- ⏳ CONTENU EN COURS -->
    <!-- =================== -->
    <main>
      <h1>En cours...</h1>
      <div class="loader"></div>
    </main>

    <!-- =================== -->
    <!-- 📜 TRANSITION FX    -->
    <!-- =================== -->
    <div class="page-transition"></div>

    <script>
      window.addEventListener("load", () => {
        document.body.classList.add("loaded");
      });
    </script>
  </body>
</html>
