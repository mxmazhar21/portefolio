<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- =================== -->
    <!-- 🌐 RESET ET BASE    -->
    <!-- =================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maz'Wave</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="../assets/images/m2.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- =================== -->
    <!-- 🎥 Vidéo de fond     -->
    <!-- =================== -->
    <video autoplay muted class="background-video">
      <source src="../assets/videos/background.mp4" type="video/mp4" />
      Votre navigateur ne supporte pas la vidéo HTML5.
    </video>

    <!-- =================== -->
    <!-- 🖼️ HEADER (fond)     -->
    <!-- =================== -->
    <header>
      <!-- =================== -->
      <!-- 🗺️ NAVBAR FIXE      -->
      <!-- =================== -->
      <nav class="navbar">
        <div class="logo">Mon Portfolio</div>
        <ul class="nav-links">
          <li>
            <a
              href="index.html"
              class="nav-link"
              style="border-bottom: 2px solid #ffce73"
            >
              Accueil
            </a>
          </li>
          <li>
            <a href="../apropos/apropos.html" class="nav-link">À propos</a>
          </li>
          <li>
            <a href="../projet/projet.html" class="nav-link">Projets</a>
          </li>
          <li>
            <a href="../contact/contact.html" class="nav-link">Contact</a>
          </li>
        </ul>
      </nav>
      <!-- 🔁 Transition de page (à placer après la navbar, pas dans la liste) -->
      <div class="page-transition" id="page-transition"></div>

      <!-- =================== -->
      <!-- 👋 HERO / Accueil    -->
      <!-- =================== -->
      <div class="hero">
        <h1><span id="typed-text"></span><span class="cursor">|</span></h1>
        <p>Bienvenue dans mon univers numérique</p>
      </div>
    </header>

    <!-- =================== -->
    <!-- ✨ EFFETS JS         -->
    <!-- =================== -->
    <script>
      // Message dynamique
      const text = "Salut, moi c’est Mazhar, développeur passionné.";
      let index = 0;
      const speed = 80;

      function typeWriter() {
        if (index < text.length) {
          document.getElementById("typed-text").innerHTML += text.charAt(index);
          index++;
          setTimeout(typeWriter, speed);
        }
      }

      window.onload = typeWriter;

      // Rebond Vidéo
      const video = document.querySelector(".background-video");
      let reverse = false;

      video.playbackRate = 1;
      video.play();

      function loopPlayback() {
        if (!reverse && video.currentTime >= video.duration - 0.05) {
          reverse = true;
          video.playbackRate = -1;
        } else if (reverse && video.currentTime <= 0.05) {
          reverse = false;
          video.playbackRate = 1;
        }
        requestAnimationFrame(loopPlayback);
      }
      loopPlayback();

      // ✅ Animation redirection
      const links = document.querySelectorAll(".nav-link");
      const transitionLayer = document.getElementById("page-transition");

      links.forEach((link) => {
        link.addEventListener("click", function (e) {
          e.preventDefault(); // bloque la navigation immédiate

          const href = this.href;

          // active le blur et le fondu
          transitionLayer.classList.add("active");
          document.body.classList.add("blur-out");

          // après la durée de l'animation, on redirige
          setTimeout(() => {
            window.location.href = href;
          }, 500); // durée en ms (doit correspondre à la transition CSS)
        });
      });

      // ✅ Reload Animation
      window.addEventListener("load", () => {
        document.body.classList.add("loaded");
      });
    </script>
  </body>
</html>
